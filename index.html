<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handoff Implementação — Preâmbulo Tech</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%235D9CD4' stroke-width='9'/><circle cx='50' cy='50' r='25' fill='none' stroke='%235D9CD4' stroke-width='9'/><circle cx='50' cy='50' r='9' fill='%235D9CD4'/></svg>">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --charcoal:#2D2D2D; --navy:#5D9CD4; --white:#fff;
  --bg:#E2E8F0; --border:#d8dde6;
  --shadow:0 1px 4px rgba(52,55,72,0.10), 0 0 0 0.5px rgba(52,55,72,0.07);
  --radius:12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Titillium Web', Calibri, 'Segoe UI', sans-serif; font-size: 14px; background: var(--bg); color: var(--charcoal); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

/* ── AUTH GATE ── */
#auth-gate { position: fixed; inset: 0; z-index: 10; background: #1c1e22; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; overflow: hidden; }
.auth-rings { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; pointer-events: none; }
.auth-chevrons { position: absolute; right: -6%; top: 8%; width: 60%; max-width: 420px; opacity: .9; pointer-events: none; }
.auth-panel { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.auth-mark { width: 54px; height: 54px; }
#auth-gate h2 { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 800; color: #fff; text-align: center; }
#auth-gate p { font-size: 13px; color: rgba(255,255,255,.5); text-align: center; margin: 0; }
.auth-btn { font-family: 'Montserrat', sans-serif; background: linear-gradient(135deg,#7EC0EA,var(--navy)); color: #12242f; border: none; border-radius: 24px; padding: .75rem 2rem; font-size: 13px; font-weight: 800; cursor: pointer; letter-spacing: .02em; box-shadow: 0 4px 14px rgba(93,156,212,.35); transition: opacity .15s; }
.auth-btn:hover { opacity: .88; }

/* ── SELETOR ── */
.selector-wrap { display: none; width: 100%; max-width: 540px; }

.selector-header { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--charcoal) 0%, var(--navy) 100%); color: #fff; border-radius: var(--radius); padding: 24px 28px 22px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(93,156,212,0.22); }
.selector-header .h-rings { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; pointer-events: none; }
.selector-header .h-chev { position: absolute; right: -3%; top: -22%; width: 22%; max-width: 120px; opacity: .45; pointer-events: none; }
.selector-header-inner { position: relative; z-index: 2; }
.selector-header h1 { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: -.2px; }
.selector-header p { font-size: 11.5px; color: rgba(255,255,255,.62); margin-top: 5px; }

.product-cards { display: flex; flex-direction: column; gap: 12px; }

.product-card { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); text-decoration: none; color: inherit; border: 1.5px solid transparent; transition: border-color .15s, box-shadow .15s; cursor: pointer; }
.product-card:hover { border-color: var(--navy); box-shadow: 0 4px 16px rgba(93,156,212,0.18); }
.product-card-icon { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #E7F1FA, #c8dff2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.product-card-icon svg { width: 22px; height: 22px; }
.product-card-body { flex: 1; }
.product-card-body strong { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 800; display: block; margin-bottom: 3px; }
.product-card-body span { font-size: 12px; color: #718096; }
.product-card-arrow { color: var(--navy); opacity: .7; flex-shrink: 0; }

.selector-footer { margin-top: 20px; text-align: center; font-size: 11px; color: #a0aec0; }
.footer-badge { min-width: 26px; height: 18px; padding: 0 6px; border-radius: 9px; background: linear-gradient(135deg,var(--navy),#6B7DE0); display: inline-flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-size: 9px; font-weight: 800; color: #fff; letter-spacing: .03em; vertical-align: middle; margin-left: 6px; line-height: 1; }
</style>
</head>
<body>

<!-- AUTH GATE -->
<div id="auth-gate">
  <svg class="auth-rings" viewBox="0 0 600 560" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <defs>
      <radialGradient id="authRingFade" cx="70%" cy="-10%" r="90%">
        <stop offset="0%" stop-color="#7EC0EA" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#7EC0EA" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g stroke="#6fa8c9" fill="none" stroke-width="1">
      <circle cx="430" cy="-60" r="120" opacity="0.5"/><circle cx="430" cy="-60" r="160" opacity="0.45"/><circle cx="430" cy="-60" r="200" opacity="0.4"/><circle cx="430" cy="-60" r="240" opacity="0.35"/><circle cx="430" cy="-60" r="280" opacity="0.3"/><circle cx="430" cy="-60" r="320" opacity="0.25"/><circle cx="430" cy="-60" r="360" opacity="0.2"/><circle cx="430" cy="-60" r="400" opacity="0.15"/>
    </g>
    <rect x="0" y="0" width="600" height="560" fill="url(#authRingFade)"/>
  </svg>
  <svg class="auth-chevrons" viewBox="0 0 260 260" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="authChevGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#a9c8db"/>
        <stop offset="100%" stop-color="#2f4550"/>
      </linearGradient>
    </defs>
    <path d="M50 210 L130 130 L210 210" stroke="#3f5560" stroke-width="26" opacity="0.4" transform="translate(18,-10)"/>
    <path d="M40 220 L130 130 L220 220" stroke="url(#authChevGrad)" stroke-width="30" stroke-linejoin="round" stroke-linecap="square"/>
  </svg>
  <div class="auth-panel">
    <svg class="auth-mark" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M20 66 L50 36 L80 66" stroke="#7EC0EA" stroke-width="11" fill="none" stroke-linejoin="round" stroke-linecap="square"/>
    </svg>
    <h2>Handoff Implementação</h2>
    <p>Acesso restrito · Preâmbulo Tech</p>
    <button class="auth-btn" id="auth-btn-login" onclick="if(window.netlifyIdentity)window.netlifyIdentity.open()">Entrar</button>
  </div>
</div>

<!-- SELETOR DE PRODUTO -->
<div class="selector-wrap">

  <div class="selector-header">
    <svg class="h-rings" viewBox="0 0 400 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g stroke="#fff" fill="none" stroke-width="1">
        <circle cx="370" cy="20" r="80" opacity="0.2"/><circle cx="370" cy="20" r="120" opacity="0.15"/><circle cx="370" cy="20" r="160" opacity="0.1"/>
      </g>
    </svg>
    <svg class="h-chev" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <path d="M20 100 L60 50 L100 100" stroke="rgba(255,255,255,0.25)" stroke-width="14" stroke-linejoin="round" stroke-linecap="square"/>
    </svg>
    <div class="selector-header-inner">
      <h1>Handoff Implementação</h1>
      <p>Selecione o produto para abrir o formulário</p>
    </div>
  </div>

  <div class="product-cards">

    <a class="product-card" href="handoff-cpj3c.html">
      <div class="product-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5D9CD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M8 12h8M8 8h8M8 16h5"/>
        </svg>
      </div>
      <div class="product-card-body">
        <strong>CPJ-3C</strong>
        <span>ERP jurídico para médios escritórios</span>
      </div>
      <div class="product-card-arrow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>
    </a>

    <a class="product-card" href="handoff-officeadv.html">
      <div class="product-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5D9CD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
          <path d="M16 3l-4 4-4-4"/>
        </svg>
      </div>
      <div class="product-card-body">
        <strong>Office ADV</strong>
        <span>ERP jurídico para pequenos e médios escritórios</span>
      </div>
      <div class="product-card-arrow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>
    </a>

  </div>

  <div class="selector-footer">
    Preâmbulo Tech &nbsp;·&nbsp; Diretoria de Operações <span class="footer-badge">BKC</span>
  </div>

</div>

<script>
function mostrarSeletor() {
  document.getElementById('auth-gate').style.display = 'none';
  document.querySelector('.selector-wrap').style.display = 'block';
}
if (window.netlifyIdentity) {
  window.netlifyIdentity.on('init', user => { if (user) mostrarSeletor(); });
  window.netlifyIdentity.on('login', () => { mostrarSeletor(); window.netlifyIdentity.close(); });
  window.netlifyIdentity.on('signup', () => { mostrarSeletor(); window.netlifyIdentity.close(); });
}
</script>
</body>
</html>
